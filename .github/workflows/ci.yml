# PFM — continuous integration (Step 01 Task 08; data engine checks added in Step 02 Phase 08).
# Every step is mandatory: any failure fails the workflow.
# This workflow publishes NOTHING. Encrypted data publication is not implemented yet
# (open decisions OD-1 and OD-7, docs/decisions/open-decisions.md).
# TODO(SEC-06, proposed): pin third-party actions to commit SHAs once the repository exists.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  CI: "true"

jobs:
  verify:
    name: Lint, types, tests, data, build, E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: 1. Install dependencies
        run: npm ci

      - name: Guard — no database, ORM, remote store or GitHub write client (ADR-001)
        run: npm run guard:deps

      - name: 2. Lint
        run: npm run lint

      - name: 3. TypeScript validation (strict)
        run: npm run typecheck

      - name: Design tokens match the approved Design System
        run: npm run tokens:check

      - name: 4a. Domain types and money arithmetic
        run: npm run test:domain

      - name: 4b. JSON Schemas are in sync with the Zod models
        run: npm run schemas:check

      - name: 4c. Data — structure (layer 1)
        run: npm run data:validate -- --only structure

      - name: 4d. Data — references and currencies (layer 2)
        run: npm run data:validate -- --only references

      - name: 4e. Data — unique ids, partitions and duplicates (layer 3)
        run: npm run data:validate -- --only uniqueness

      - name: 4f. Data — invariants and checksums (layer 4)
        run: npm run data:validate -- --only invariants

      - name: 4g. Migrations — data/ is at the current schemaVersion, migration tests
        run: |
          npm run data:migrate -- --check
          npm run test:migrations

      - name: 4h. Repositories and local persistence (IndexedDB)
        run: npm run test:repositories

      - name: 4i. Import / export and changeset format
        run: |
          npm run test:exchange
          npm run data:changeset -- tests/fixtures/changesets/sample.changeset.json

      - name: 4j. Security tests (bundle failure modes, no hidden encryption claims)
        run: npm run test:security

      - name: 5. All unit and integration tests
        run: npm test

      - name: 6. Build
        run: npm run build

      - name: Guard — no plaintext data in public artifacts (SEC-01)
        run: npm run guard:artifacts

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: 7. E2E tests (production build)
        run: npm run test:e2e

      - name: 8. Supabase Auth E2E (separate build, fake Auth server — no real project)
        run: |
          npm run build:e2e:supabase
          NEXT_DIST_DIR=.next-e2e-supabase npm run guard:artifacts
          npm run test:e2e:supabase

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
