<!-- @dsCard height=288 -->
<div class="cover">
  <style>
    .cover { position: relative; width: 960px; height: 288px; background: var(--bg-paper); overflow: hidden; }
    .cover svg { position: absolute; inset: 0; }
    .forest { fill: var(--forest); } .ink { fill: var(--ink); } .sage { fill: var(--sage); } .lake { fill: var(--lake); } .tint { fill: var(--forest-tint); }
    .hair { stroke: var(--line); stroke-width: 1; }
    .dbl { stroke: var(--bg-paper); stroke-width: 1; }
    .name { position: absolute; left: 48px; bottom: 76px; font-family: var(--font-serif); font-size: 120px; line-height: 0.92; letter-spacing: -0.02em; color: var(--ink); max-width: 440px; }
    .tag { position: absolute; left: 50px; bottom: 44px; font-family: var(--font-sans); font-size: 14px; line-height: 20px; color: var(--ink-2); max-width: 400px; }
  </style>
  <svg viewBox="0 0 960 288" width="960" height="288" aria-hidden="true">
    <!-- blocks: forest 232×216 (space × multiples), ink 120×192, sage 80×144, lake 80×48, forest-tint 120×72; radius-xs on none (square, Swiss) -->
    <!-- arrangement: one tall forest slab bleeding off the top with satellites stepping down to the right edge, like the dashboard's 7/1/4 diagonal -->
    <!-- pattern: editorial row — "hairlines, não caixas": three ruled lines at the space-9-ish pitch (72px) plus the ledger double rule of the 'Líquido' total -->
    <!-- steps: space-5 24, space-7 48, space-9 96 multiples; rules 1px line; double rule 1px paper ×2 at 3px -->
    <rect class="tint" x="496" y="216" width="120" height="72"/>
    <rect class="forest" x="528" y="0" width="232" height="216"/>
    <rect class="ink" x="776" y="96" width="120" height="192"/>
    <rect class="sage" x="880" y="0" width="80" height="144"/>
    <rect class="lake" x="912" y="168" width="48" height="48"/>
    <line class="hair" x1="480" x2="960" y1="72.5" y2="72.5"/>
    <line class="hair" x1="480" x2="960" y1="144.5" y2="144.5"/>
    <line class="hair" x1="480" x2="960" y1="216.5" y2="216.5"/>
    <line class="dbl" x1="776" x2="896" y1="240.5" y2="240.5"/>
    <line class="dbl" x1="776" x2="896" y1="243.5" y2="243.5"/>
  </svg>
  <div class="name">PFM</div>
  <div class="tag">Finanças pessoais com a calma de uma página bem composta.</div>
</div>
